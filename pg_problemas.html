<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientações</title>
    <style>

        /* vi que dava para criar esse root para puxar as cores da paleta */
        :root {
            --verde-primario: #03542F;
            --verde-secundario: #117743;
            --cinza-escuro: #455C5D;
            --branco-100: #FFFFFF;
        }

        /* Zerando margin e padding do body */
        div, header, body{
            margin: 0;
            padding: 0;
        }

        /* configs do header e seus conteudos */

        .OR-header-problemas {
            
            display: flex;
            background-color: var(--verde-secundario)
            
        }

        .OR-header-problemas > div {
            flex: 1;
        }

        .OR-header-content {
            min-height: 200px;
            border-radius: 15px;
            margin-inline: 30px;
            margin-block: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: left;
        }

        .OR-header-content h1 {
            font-size: 70px;
            margin-block: 0;
            color: var(--branco-100);
        }
        .OR-header-content h3 {
            margin-block-start: 0px;
            color: var(--branco-100);
            font-size: 35px;
        }

        .OR-header-content-image {
            border-radius: 25px;
            margin: 15px;
        }

    </style>
</head>
<body>

    <!--Essa header-problemas vai ser a seção inicial com um titulo uma breve introdução e uma imagem referente ao assunto-->

    <header class="OR-header-problemas">
        <div class="OR-header-content">

            <h1 >TITULO</h1>
            <h3>sub-titulo</h3>

        </div>
        <div>

            <img class="OR-header-content-image"  src="/assets/happy-african-american-designer-presenting-project-client-tablet-smiling.jpg" width="400px">

        </div>
    </header>

</body>
</html>
