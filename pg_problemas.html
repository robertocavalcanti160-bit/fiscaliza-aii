<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientações</title>
    <style>

        /* vi que dava para criar esse root para puxar as cores da paleta */
        :root {
            --verde-primario: #03542F;
            --verde-secundario: #117743;
            --cinza-escuro: #455C5D;
            --branco-100: #FFFFFF;
        }

        /* Zerando margin e padding do body */
        div, header, body{
            margin: 0;
            padding: 0;
        }

        /* configs do header e seus conteudos */

        .OR-header-problemas  {
            
            display: flex;
            background-image: url(/assets/happy-african-american-designer-presenting-project-client-tablet-smiling.jpg);
            background-size:cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 500px;
            
        }


        .OR-header-problemas  > div {
            flex: 1;
            min-width: 0;
        }

        .OR-header-content {
            min-height: 200px;
            border-radius: 15px;
            margin-inline: 240px;
            margin-block: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: left;
        }
        

        .OR-header-content  h1 {
            font-size: 70px;
            margin-block: 0;
            color: var(--branco-100);
        }
        .OR-header-content h3 {
            margin-block-start: 0px;
            color: var(--branco-100);
            font-size: 25px;
            max-width: 550px;
            text-align: center;
            
        }


        /* 
        ====================================================
        inicio do css para a seção de problemas de pavimento
        ====================================================
        */


        .OR-header-content-image , .OR-pb-pavimento-img {
            border-radius: 25px;
            margin: 15px;
        }


        .OR-pb-pavimento-content h3 {
            margin-block-start: 0px;
            color: var(--branco-100);
            font-size: 25px;
            max-width: 650px;
            text-align: center;

        }

        .OR-pb-pavimento-content h1 {
            font-size: 70px;
            margin-block: 0;
            color: var(--branco-100);
            max-width: 600px;
            text-align: center;
        }
        .OR-pb-pavimento-content {
            min-height: 200px;
            border-radius: 15px;
            margin-inline: 240px;
            margin-block: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: left;
        }
        .OR-pb-pavimento  {
            display: flex ;
            background-color: var(--verde-primario)
            
        }
        .OR-pb-pavimento > div {
            flex: 1;
            min-width: 0;
        }

    </style>
</head>
<body>

    <!--Essa header-problemas vai ser a seção inicial com um titulo uma breve introdução e uma imagem referente ao assunto-->

    <header class="OR-header-problemas">
        <div class="OR-header-content">

            <h1 >ORIENTAÇÕES</h1>
            <h3>Essa seção de nosso site, vai lhe ensinar como indentificar um problema a ser denuciado.</h3>

        </div>
        <div>

            

        </div>
   </header>

       <section class="OR-pb-pavimento">
            <div class="OR-pb-pavimento-content">

                <h1 >IRREGULARIDADE NO PAVIMENTO</h1>
                <h3>Essa seção de nosso site, vai lhe ensinar como indentificar um problema a ser denuciado.</h3>

            </div>
            <div>

                <img class="OR-pb-pavimento-img"  src="https://www.jornaldocomercio.com/_midias/jpg/2018/10/17/rodovia_estrada_rs_377_em_sao_francisco_de_assis_esburacada_com_buraco_no_asfalto__divulgacao_cnt-8510753.jpg" width="500px">

            </div>
        </section>

    




</body>
</html>
