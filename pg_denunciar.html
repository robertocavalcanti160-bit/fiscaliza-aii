        header > a {
            display: flex;

            align-items: center;

        }

        nav a {

<body>
    <header>

    <div class="denunciar">
        <div class="formulario">
            <h2>Denunciar Problema Urbano</h2>
            <form action="/denunciar" method="post">
                <label>Motivo da denúncia:</label><br>
                <textarea id="motivo" name="motivo" required></textarea><br><br>
                <label>Cidade:</label><br>
                <textarea id="cidade" name="cidade" required></textarea><br><br>
                <label>Tipo:</label><br>
                <textarea id="tipo" name="tipo" required></textarea><br><br>
                <label>Contato:</label><br>
                <textarea id="contato" name="contato"></textarea><br><br>
                <input type="submit" value="Enviar Denúncia">
            </form>
        </div>
    </div>
