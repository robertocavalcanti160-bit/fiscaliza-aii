<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Denunciar | Fiscaliza Aí</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md bg-success" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <img src="img/logo.png" alt="" class="logo">
          Fiscaliza Aí
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="problemas.html">Problemas</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="denunciar.html">Denunciar</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="container py-5 formulario">
      <h1>Registrar denúncia</h1>
      <p>Todos os campos são obrigatórios.</p>

      <div class="alert alert-danger d-none" id="aviso" role="alert">
        Preencha todos os campos obrigatórios.
      </div>

      <form id="form-denuncia" novalidate>
        <div class="mb-3">
          <label class="form-label" for="nome">Nome</label>
          <input class="form-control" type="text" id="nome">
        </div>
        <div class="mb-3">
          <label class="form-label" for="categoria">Categoria</label>
          <select class="form-select" id="categoria">
            <option value="">Selecione</option>
            <option value="Buracos nas ruas">Buracos nas ruas</option>
            <option value="Iluminação pública">Iluminação pública</option>
            <option value="Acúmulo de lixo">Acúmulo de lixo</option>
            <option value="Calçadas danificadas">Calçadas danificadas</option>
            <option value="Saneamento">Saneamento</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="endereco">Endereço</label>
          <input class="form-control" type="text" id="endereco">
        </div>
        <div class="mb-3">
          <label class="form-label" for="descricao">Descrição</label>
          <textarea class="form-control" id="descricao" rows="4"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Enviar denúncia</button>
      </form>
    </section>
  </main>

  <footer class="bg-success text-white text-center py-3">
    <div class="container">
      <strong>Fiscaliza Aí</strong> · Projeto acadêmico · Engenharia de Software e Ciências da Computação
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
